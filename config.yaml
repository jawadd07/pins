products_file: products.csv
out_dir: docs
text:
  provider: template                 # template (free, no key) | gemini (free tier, GEMINI_API_KEY) | claude (paid)
  gemini_model: gemini-2.0-flash     # check current name at aistudio.google.com if error
claude_model: claude-sonnet-5-5      # only if provider: claude
variants_per_product: 8              # unique pins per product

image:
  provider: pexels                   # pexels (free photos, key in keys.bat) | pollinations (now needs key) | fal (paid) | product (image_url)
  fal_endpoint: https://fal.run/fal-ai/flux/dev
  overlay_text: true

# GitHub Pages: push site/ folder -> https://jawadd07.github.io/pins
media_base_url: https://jawadd07.github.io/pins
landing_base_url: https://jawadd07.github.io/pins   # empty "" = pin links straight to affiliate url (riskier)

pin_disclosure: "#ad Affiliate link."
landing_disclosure: "Disclosure: this page contains affiliate links. I may earn a commission at no extra cost to you. As an Amazon Associate I earn from qualifying purchases."

default_board: Home Decor Ideas
boards:                              # category -> exact Pinterest board name
  boho: Boho Decor Ideas
  home-decor: Home Decor Ideas
  kitchen: Kitchen Gadgets
  slow-living: Cozy Slow Living
  fashion: Fashion Finds
  jewelry: Statement Jewelry
  beauty: Beauty Favorites
  gifts: Gift Ideas
  organization: Home Organization
  fitness: Home Workout
  pets: Pet Lovers
  party: Party Ideas

schedule:
  start_date: ""                     # "" = tomorrow, or 2026-11-10
  ramp: [15, 20]                     # pins/day, week1, week2+
  hours: [9, 22]                     # random post times in this window

# only for post-due (after API approval). name -> board id
board_ids: {}
